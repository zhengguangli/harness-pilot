# hooks.yaml — Harness 统一钩子配置
#
# 抽象事件名 → 各工具原生事件映射:
#   on_session_start  → Claude: SessionStart       Codex: SessionStart         OpenCode: session.created
#   on_file_edit      → Claude: PostToolUse(Edit)   Codex: PostToolUse(Edit)    OpenCode: file.edited
#   on_compact        → Claude: PreCompact          Codex: PreCompact           OpenCode: experimental.session.compacting
#   on_turn_end       → Claude: Stop                Codex: Stop                 OpenCode: session.idle
#
# 脚本格式: .mjs (Node.js ESM)，支持 CLI 和 import 双模式
# 所有脚本始终 exit 0（警告输出到 stderr，不阻塞 AI 工具）

hooks:
  on_session_start:
    - script: context-check.mjs
      description: 检查 AGENTS.md 新鲜度和完整性
    - script: env-verify.mjs
      description: 验证环境就绪

  on_file_edit:
    - script: lint-check.mjs
      description: 架构边界 + docs/ 大小约束检查

  on_compact:
    - script: compaction.mjs
      description: 上下文压缩 — 生成增强摘要（含 trace + metrics + 续行提示）

  on_turn_end:
    - script: continuation.mjs
      description: Ralph Loop — 检测中断并生成续行提示
    - script: trace-log.mjs
      description: 记录执行日志
    - script: quality-metric.mjs
      description: 追踪质量指标
