# hooks.yaml — Harness Unified Hook Configuration
#
# Abstract event → Native event mapping:
#   on_session_start  → Claude: SessionStart       Codex: SessionStart         OpenCode: session.created
#   on_file_edit      → Claude: PostToolUse(Edit)   Codex: PostToolUse(Edit)    OpenCode: file.edited
#   on_tool_output    → Claude: PostToolUse(*)       Codex: PostToolUse(*)       OpenCode: tool.executed
#   on_compact        → Claude: PreCompact          Codex: PreCompact           OpenCode: experimental.session.compacting
#   on_turn_end       → Claude: Stop                Codex: Stop                 OpenCode: session.idle
#
# All scripts: .mjs (Node.js ESM), dual-mode (CLI + import)
# All scripts always exit 0 (warnings → stderr, never block)

hooks:
  on_session_start:
    - script: context-check.mjs
      description: Check AGENTS.md freshness and integrity
    - script: env-verify.mjs
      description: Verify environment ready

  on_file_edit:
    - script: lint-check.mjs
      description: Architecture boundaries + docs/ size constraint check
    - script: apply-patch.mjs
      description: Apply Patch validation — unified diff format, line offset tolerance, conflict detection

  on_tool_output:
    - script: tool-offload.mjs
      description: Tool output offload — large outputs truncated to head/tail, full content → filesystem
      condition: output_size > 2000
    - script: retry-timeout.mjs
      description: Fault tolerance — detect error codes, manage retry count, timeout, and circuit breaker
    - script: context-cleanup.mjs
      description: File ref tracking — record read files for auto-unload

  on_compact:
    - script: compaction.mjs
      description: Context compaction — enhanced summary (trace + metrics + continuation hint)

  on_turn_end:
    - script: continuation.mjs
      description: Ralph Loop — detect interruption, generate continuation prompt
    - script: trace-log.mjs
      description: Record execution log
    - script: quality-metric.mjs
      description: Track quality metrics
    - script: test-run.mjs
      description: Run project tests — auto-detect test framework and execute
    - script: context-cleanup.mjs
      description: File ref cleanup — check unloadable files and generate cleanup suggestions
