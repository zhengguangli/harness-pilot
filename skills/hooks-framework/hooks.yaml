# Hooks Framework — Unified Configuration
# This file is the declarative configuration layer. install.mjs translates
# these abstract hooks to each tool's native format:
#   Claude Code → .claude/settings.json
#   Codex       → .codex/hooks.json
#   OpenCode    → .opencode/plugins/

hooks:
  # ── Session Lifecycle ──
  - event: on_session_start
    description: Run when agent session starts
    actions:
      - script: scripts/context-check.mjs
        description: Check AGENTS.md freshness
      - script: scripts/env-verify.mjs
        description: Verify environment readiness

  # ── File Editing ──
  - event: on_file_edit
    description: Run after file edit operations
    actions:
      - script: scripts/lint-check.mjs
        description: Architecture boundary check

  # ── Apply Patch ──
  - event: on_apply_patch
    description: Run after apply_patch tool execution
    actions:
      - script: scripts/apply-patch.mjs
        description: Validate and apply patch

  # ── Tool Output ──
  - event: on_tool_output
    description: Run after any tool execution
    actions:
      - script: scripts/tool-offload.mjs
        condition: "output_length > 2000"
        description: Offload large outputs to filesystem
      - script: scripts/context-cleanup.mjs
        description: Track file references

  # ── Compaction ──
  - event: on_compact
    description: Run before context compaction
    actions:
      - script: scripts/compaction.mjs
        description: Generate compaction summary

  # ── Turn End ──
  - event: on_turn_end
    description: Run when agent turn ends
    actions:
      - script: scripts/todo-sync.mjs
        description: Sync todo state to filesystem
      - script: scripts/continuation.mjs
        description: Check if task needs continuation
      - script: scripts/quality-metric.mjs
        description: Record quality metrics
      - script: scripts/trace-log.mjs
        description: Log execution trace

  # ── Error Handling ──
  - event: on_error
    description: Run when tool execution fails
    actions:
      - script: scripts/retry-timeout.mjs
        description: Handle retry logic and circuit breaker

# Configuration parameters
config:
  tool_offload_threshold: 2000
  ref_ttl_ms: 300000
  harness_workspace: .harness-polit
  max_retries: 3
  circuit_breaker_threshold: 5
  circuit_breaker_timeout: 600000
